# demo username to password map, no longer read by the console backend
# (mint_spear_shield_token mints tokens via impersonation now, not password
# grant), kept only so scripts/08-install-console.sh's ensure_sso_realm_demo_users
# can seed matching logins into the separate sso realm for actual console sign in
apiVersion: v1
kind: Secret
metadata:
  name: spear-shield-console-creds
  namespace: spear-console
  labels:
    app.kubernetes.io/part-of: spear-agents
type: Opaque
stringData:
  balakrishnan.b: ConsoleTest#2026
  siddhartha.de: ConsoleTest#2026
---
# spear-coordinator client secret, used by mint_spear_shield_token for both
# its own service account token and the final auth code exchange (matches realm import)
apiVersion: v1
kind: Secret
metadata:
  name: spear-coordinator-client-secret
  namespace: spear-console
  labels:
    app.kubernetes.io/part-of: spear-agents
type: Opaque
stringData:
